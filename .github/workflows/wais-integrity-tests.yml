name: WAIS Integrity Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.json"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run data integrity regression suite
        run: pytest -q tests/test_data_integrity.py
      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check auto-refresh.js
          node --check wais-runtime-guard.js
          node --check wais-public-state.js
