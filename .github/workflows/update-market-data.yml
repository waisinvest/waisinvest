name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 14-22 * * 1-5"
    - cron: "15 12 * * 0"

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade yfinance

      - name: Update market data
        run: python update_market_data.py

      - name: Commit updated files
        run: |
          git config user.name "wais-market-bot"
          git config user.email "wais-market-bot@users.noreply.github.com"
          git add market-indicators.json weekly-events.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
          else
            git commit -m "Auto update WAIS market data"
            git push
          fi
