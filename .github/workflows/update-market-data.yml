name: Update Market Data
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 14-22 * * 1-5"
    - cron: "15 12 * * 0"
permissions:
  contents: write
jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yfinance
      - run: python update_market_data.py
      - run: |
          git config user.name "wais-market-bot"
          git config user.email "wais-market-bot@users.noreply.github.com"
          git add market-indicators.json weekly-events.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Auto update WAIS market data and events" && git push; fi
