name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes across Hong Kong daytime, US pre-market, regular session and after-hours.
    - cron: "15,45 0-23 * * 1-5"
    - cron: "15 12 * * 0"

permissions:
  contents: write

concurrency:
  group: wais-data-publish
  cancel-in-progress: false

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade yfinance
      - name: Update market data
        run: python update_market_data.py
      - name: Commit and publish safely
        run: |
          git config user.name "wais-market-bot"
          git config user.email "wais-market-bot@users.noreply.github.com"
          git add market-indicators.json weekly-events.json
          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
            exit 0
          fi
          git commit -m "Auto update WAIS market data"
          git pull --rebase origin main
          git push origin HEAD:main
