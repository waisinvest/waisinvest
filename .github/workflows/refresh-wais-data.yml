name: Refresh WAIS Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-wais-data.yml"
  schedule:
    # Every 5 minutes on weekdays, offset from the top of the hour to reduce scheduler congestion.
    - cron: "3-58/5 0-23 * * 1-5"
    # Sunday maintenance / economic calendar refresh.
    - cron: "18 12 * * 0"

permissions:
  contents: write

concurrency:
  group: wais-data-publish
  cancel-in-progress: false

jobs:
  refresh-wais-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade yfinance

      - name: Update market data
        run: python update_market_data.py

      - name: Update stock and income ETF data
        run: python update_stock_prices.py

      - name: Commit and publish safely
        run: |
          git config user.name "wais-data-bot"
          git config user.email "wais-data-bot@users.noreply.github.com"
          git add market-indicators.json weekly-events.json stock-prices.json
          if git diff --cached --quiet; then
            echo "No WAIS data changes to commit."
            exit 0
          fi
          git commit -m "Auto refresh WAIS market, stock and income ETF data"
          git pull --rebase origin main
          git push origin HEAD:main
