name: AUTO · Refresh WAIS Data (5-min target)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-wais-data.yml"
      - "update_market_data.py"
      - "update_stock_prices.py"
      - "update_income_research_universe.py"
  schedule:
    # Fast data layer: target every 5 minutes on weekdays, offset from :00 to reduce GitHub scheduler congestion.
    # GitHub scheduled workflows are best-effort, so runtime freshness guards remain authoritative.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * 1-5"
    # Weekend recovery/health run: retry sources hourly on Saturday/Sunday.
    # Market-closed data remains the latest valid close; any source that recovers replaces fallback automatically.
    - cron: "18 * * * 6,0"

permissions:
  contents: write

concurrency:
  group: wais-data-publish
  cancel-in-progress: false

jobs:
  refresh-wais-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade yfinance

      - name: Update market data without stopping the pipeline
        shell: bash
        run: |
          set +e
          python update_market_data.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Market-data refresh failed. WAIS will preserve the last-known-good files and continue with other sources. The next scheduled cycle will retry the source."
          fi
          exit 0

      - name: Update stock and expanded income ETF data without stopping the pipeline
        shell: bash
        run: |
          set +e
          python update_income_research_universe.py
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Stock/income refresh failed. WAIS will preserve the last-known-good files and continue publishing any other valid updates. The next scheduled cycle will retry the source."
          fi
          exit 0

      - name: Validate outputs and restore last-known-good copies if needed
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          files = ["market-indicators.json", "weekly-events.json", "stock-prices.json"]
          for name in files:
              path = Path(name)
              valid = False
              if path.exists():
                  try:
                      json.loads(path.read_text(encoding="utf-8"))
                      valid = True
                  except Exception as exc:
                      print(f"::warning::{name} is invalid after refresh: {exc}")
              else:
                  print(f"::warning::{name} is missing after refresh")

              if not valid:
                  result = subprocess.run(["git", "checkout", "HEAD", "--", name], check=False)
                  if result.returncode == 0:
                      print(f"Restored last-known-good {name} from HEAD. A later scheduled cycle will retry fresh acquisition.")
                  else:
                      print(f"::warning::Could not restore {name}; continuing so unrelated valid sources are not blocked.")
          PY

      - name: Commit and publish safely
        run: |
          git config user.name "wais-data-bot"
          git config user.email "wais-data-bot@users.noreply.github.com"
          git add market-indicators.json weekly-events.json stock-prices.json
          if git diff --cached --quiet; then
            echo "No WAIS data changes to commit. Last-known-good data remains active; future scheduled cycles will keep retrying."
            exit 0
          fi
          git commit -m "Auto refresh WAIS market, stock and expanded income ETF data"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "WAIS data published on attempt ${attempt}."
              exit 0
            fi
            echo "Concurrent main update detected; retrying publish (${attempt}/4)."
            sleep $((attempt * 3))
          done
          echo "WAIS data publish failed after retries."
          exit 1
