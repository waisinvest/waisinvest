name: Update Stock Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 14-22 * * 1-5"

permissions:
  contents: write

jobs:
  update-stock-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: python -m pip install --upgrade yfinance

      - name: Update stock prices
        run: python update_stock_prices.py

      - name: Commit updated stock prices
        run: |
          git config user.name "wais-price-bot"
          git config user.email "wais-price-bot@users.noreply.github.com"
          git add stock-prices.json
          if git diff --cached --quiet; then
            echo "No stock price changes to commit."
          else
            git commit -m "Update stock prices"
            git push
          fi
