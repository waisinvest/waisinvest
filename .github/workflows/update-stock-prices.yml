name: Update Stock Prices
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 14-22 * * 1-5"
permissions:
  contents: write
jobs:
  update-stock-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yfinance
      - run: python update_stock_prices.py
      - run: |
          git config user.name "wais-price-bot"
          git config user.email "wais-price-bot@users.noreply.github.com"
          git add stock-prices.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Auto update WAIS stock and income ETF data" && git push; fi
