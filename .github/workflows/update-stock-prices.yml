name: Update Stock Prices

on:
  workflow_dispatch:
  schedule:
    # Broad UTC window so pre-market, regular session and after-hours are covered
    # across daylight-saving changes. The script labels the actual ET session.
    - cron: "0,30 8-23 * * 1-5"
    - cron: "0 0 * * 2-6"

permissions:
  contents: write

concurrency:
  group: wais-data-publish
  cancel-in-progress: false

jobs:
  update-stock-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --upgrade yfinance
      - name: Update stock and income ETF data
        run: python update_stock_prices.py
      - name: Commit and publish safely
        run: |
          git config user.name "wais-price-bot"
          git config user.email "wais-price-bot@users.noreply.github.com"
          git add stock-prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "Auto update WAIS stock and income ETF data"
          git pull --rebase origin main
          git push origin HEAD:main
